name: Test
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  rewrite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python3 tools/build.py
      - run: python3 tools/render-module.py hmxxgit
      - run: git diff --exit-code
      - run: node --check scripts/youtube.response.js && node --check scripts/youtube.request.js
      - run: npm test
